<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Angel Archive ⋆𐙚 ̊</title>

<div class="search-container">
    <span>⌕</span>
    <input
        type="text"
        id="movieSearch"
        placeholder="search books..."
        onkeyup="searchMovies()"
    >
</div>
  <style>
  * {
    box-sizing: border-box;
  }

  body {
    background-color: #FFECEC;
    font-family: 'Georgia', serif;
    color: #B0B0B0;
    margin: 0;
    padding: 20px;
    overflow-wrap: break-word;
  }

  h1 {
    text-align: center;
    font-size: 48px;
    margin-top: 10px;
    margin-bottom: 10px;
    color: #B0B0B0;
  }

  p.intro {
    text-align: center;
    font-size: 20px;
    line-height: 1.6;
    margin: 0 auto 40px;
    color: #B0B0B0;
    max-width: 800px;
  }

  .movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
  }

  .movie-card {
    background-color: #F8D8E2;
    padding: 12px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    text-align: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    color: #B0B0B0;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .movie-card:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
  }

  .movie-card img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 12px;
    margin: 10px 0;
  }

  .movie-card a {
    display: inline-block;
    max-width: 100%;
    background-color: #FFECEC;
    color: #B0B0B0;
    padding: 8px 12px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    overflow-wrap: anywhere;
    transition: background-color 0.2s ease, transform 0.2s ease;
  }

  .movie-card a:hover {
    background-color: #FFB6C1;
    color: #B0B0B0;
    transform: scale(1.03);
  }

  footer {
    margin-top: 50px;
    text-align: center;
    font-size: 16px;
    color: #B0B0B0;
  }

  /* Mobile layout */
  @media screen and (max-width: 600px) {
    body {
      padding: 12px;
    }

    h1 {
      font-size: clamp(27px, 8vw, 36px);
      line-height: 1.25;
      margin-top: 8px;
      margin-bottom: 12px;
    }

    p.intro {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .movie-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .movie-card {
      padding: 8px;
      border-radius: 12px;
      font-size: 13px;
    }

    .movie-card img {
      aspect-ratio: 2 / 3;
      border-radius: 9px;
      margin: 8px 0;
    }

    .movie-card a {
      display: block;
      width: 100%;
      padding: 9px 4px;
      margin-top: 4px;
      font-size: 11px;
      line-height: 1.4;
    }

    .movie-card:hover,
    .movie-card a:hover {
      transform: none;
    }

    footer {
      font-size: 13px;
      margin-top: 30px;
    }
  }

  /* Very narrow phones */
  @media screen and (max-width: 350px) {
    body {
      padding: 10px;
    }

    h1 {
      font-size: 27px;
    }

    .movie-grid {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .movie-card {
      padding: 12px;
    }
.search-container {
    text-align: center;
    margin: 30px auto;
}

#movieSearch {
    width: 65%;
    max-width: 380px;
    padding: 13px 18px;
    border: 1px solid #e5caca;
    border-radius: 3px;
    background: #fffafa;
    color: #8f7777;
    font-family: Georgia, serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    outline: none;
    box-shadow: 2px 3px 8px rgba(180, 140, 140, 0.08);
    transition: 0.3s;
}

#movieSearch:focus {
    border-color: #c9a5a5;
    background: #ffffff;
}

#movieSearch::placeholder {
    color: #c4aaaa;
    font-style: italic;
}

.search-label {
    color: #b69a9a;
    font-family: Georgia, serif;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 10px;
}
    .movie-card a {
      font-size: 13px;
    }
  }
    
  </style>
</head>

<body>

  <h1>Angel Archive ⋆𐙚 ̊</h1>
 
<p style="text-align:center; font-size:16px; color:#B0B0B0; margin-bottom:60px;">
  Books and Manga page!! all files should be hosted on filegarden, and are safe to download  ♡
</p>

  <div class="movie-grid">
    <div class="movie-card">
      The guy she was interested in wasn't a guy at all 
      <img src="https://i.pinimg.com/1200x/b1/ec/bf/b1ecbfd9a02794e06c980114ffe0c656.jpg" alt="green yuri Poster">
      <br>
      <a href="https://file.garden/aoKQVvC9s2i36Woz/The%20guy%20she%20was%20into%20wasn't%20a%20guy%20at%20all.pdf" target="_blank">Click to watch ♡</a>
    </div>



</div> <!-- ONLY ONE closing movie-grid div -->
  <script>
function searchMovies() {
    let input = document.getElementById("movieSearch").value.toLowerCase();
    let cards = document.querySelectorAll(".movie-card");

    cards.forEach(card => {
        let title = card.textContent.toLowerCase();

        if (title.includes(input)) {
            card.style.display = "";
        } else {
            card.style.display = "none";
        }
    });
}
</script>
</body>

</html>
