<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS Test</title>

    <style>
        body {
            margin: 0;
            background: #f6efe8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

#game{
    width:100%;
    box-sizing:border-box;
    aspect-ratio:4/3;
    background:black;
    border-radius:12px;
    overflow:hidden;
    border:8px solid #7f7f7f;
}
        }
        

        body{
margin:0;
background:radial-gradient(circle,#fffaf7,#f4ece4);
font-family:Georgia,serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.page{
display:flex;
flex-direction:column;
align-items:center;
gap:22px;
padding:30px;
}

.title{
font-size:40px;
font-style:italic;
color:#7c5d69;
margin:0;
text-shadow:0 2px 8px rgba(255,255,255,.8);
}

.ds{
width:min(720px,95vw);
}

.top{
position:relative;
padding:26px;
border-radius:32px 32px 14px 14px;
background:linear-gradient(#dedede,#bdbdbd);
box-shadow:
0 18px 35px rgba(0,0,0,.25),
inset 0 2px 0 rgba(255,255,255,.8);
}

.logo{
text-align:center;
font-size:12px;
letter-spacing:2px;
color:#666;
margin-bottom:10px;
}

.hinge{
height:18px;
background:linear-gradient(#c8c8c8,#a9a9a9);
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
}

.hinge-middle{
width:110px;
height:10px;
background:#8d8d8d;
border-radius:10px;
}

.bottom{
position:relative;
height:220px;
margin-top:2px;
background:linear-gradient(#d8d8d8,#bdbdbd);
border-radius:14px 14px 34px 34px;
box-shadow:
0 12px 24px rgba(0,0,0,.18),
inset 0 2px 0 rgba(255,255,255,.7);
}

.camera{
position:absolute;
top:12px;
left:50%;
transform:translateX(-50%);
width:10px;
height:10px;
border-radius:50%;
background:#4d4d4d;
box-shadow:inset 0 1px 2px rgba(255,255,255,.4);
}

.speaker{
position:absolute;
top:18px;
display:flex;
gap:5px;
}

.speaker.left{left:18px;}
.speaker.right{right:18px;}

.speaker span{
width:3px;
height:18px;
background:#8b8b8b;
border-radius:3px;
}

.dpad{
position:absolute;
left:34px;
top:58px;
width:72px;
height:72px;
}

.vertical,
.horizontal{
position:absolute;
background:#666;
border-radius:6px;
}

.vertical{
width:22px;
height:72px;
left:25px;
}

.horizontal{
width:72px;
height:22px;
top:25px;
}

.buttons{
position:absolute;
right:34px;
top:48px;
display:grid;
grid-template-columns:repeat(2,44px);
gap:18px;
}

.buttons div{
width:42px;
height:42px;
border-radius:50%;
background:linear-gradient(#989898,#6d6d6d);
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:13px;
box-shadow:
inset 0 2px 3px rgba(255,255,255,.35),
0 2px 3px rgba(0,0,0,.25);
}

.start-select{
position:absolute;
bottom:36px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:28px;
font-size:11px;
color:#666;
letter-spacing:1px;
}

.power{
position:absolute;
bottom:16px;
left:26px;
display:flex;
align-items:center;
gap:8px;
font-size:11px;
color:#555;
}

.led{
width:10px;
height:10px;
border-radius:50%;
background:#4cff6f;
box-shadow:0 0 10px #4cff6f;
animation:pulse 2s infinite;
}

@keyframes pulse{
50%{opacity:.45;}
}
    </style>
</head>

<body>

<body>

<div class="page">

  <h1 class="title">Lalaloopsy ♡</h1>

  <div class="ds">

    <div class="top">

      <div class="speaker left">
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="speaker right">
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="camera"></div>

      <div class="logo">Nintendo DS</div>

      <div id="game"></div>

    </div>

    <div class="hinge">
      <div class="hinge-middle"></div>
    </div>

    <div class="bottom">

      <div class="dpad">
        <div class="vertical"></div>
        <div class="horizontal"></div>
      </div>

      <div class="buttons">
        <div>Y</div>
        <div>X</div>
        <div>B</div>
        <div>A</div>
      </div>

      <div class="power">
        <div class="led"></div>
        POWER
      </div>

      <div class="start-select">
        <span>SELECT</span>
        <span>START</span>
      </div>

    </div>

  </div>

</div>

<script>
    EJS_player = "#game";
    EJS_core = "nds";
    EJS_pathtodata = "/emulatorjs/data/";
    EJS_gameUrl = "./Lalaloopsy%20(USA)%20(En,Fr).nds";
</script>

<script src="/emulatorjs/data/loader.js"></script>

</body>
</html>
