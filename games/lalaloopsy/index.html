<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lalaloopsy ♡ Angel Archive</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at top,#fff9f6,#f6efe8 70%);
font-family:Georgia,serif;
overflow-x:hidden;
}

body::before{
content:"✦ ✿ ✦ ✿ ✦ ✿ ✦";
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
color:#d7a8b8;
letter-spacing:18px;
font-size:20px;
opacity:.7;
}

.wrapper{
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
padding:40px 20px;
}

.title{
font-size:42px;
font-style:italic;
color:#7c5c69;
letter-spacing:1px;
text-shadow:0 2px 8px rgba(255,255,255,.8);
}

.subtitle{
font-size:14px;
color:#a38491;
margin-top:-8px;
}

.ds{

width:min(650px,95vw);

background:linear-gradient(#dedede,#bfbfbf);

border-radius:34px;

padding:24px;

box-shadow:
0 18px 40px rgba(0,0,0,.22),
inset 0 2px 0 rgba(255,255,255,.8);

}

#game{

width:100%;

aspect-ratio:4/3;

background:black;

border-radius:12px;

overflow:hidden;

border:8px solid #7f7f7f;

box-shadow:inset 0 0 18px rgba(0,0,0,.55);

}

.bottom{

margin-top:18px;

height:160px;

border-radius:20px;

background:linear-gradient(#d7d7d7,#bdbdbd);

position:relative;

box-shadow:inset 0 2px 0 rgba(255,255,255,.7);

}

.power{

position:absolute;

bottom:18px;

left:28px;

display:flex;

align-items:center;

gap:8px;

font-size:12px;

color:#555;

}

.light{

width:10px;

height:10px;

border-radius:50%;

background:#45ff6c;

box-shadow:0 0 10px #45ff6c;

}

.dpad{

position:absolute;

left:34px;

top:48px;

width:58px;

height:58px;

background:#666;

border-radius:10px;

}

.dpad::before,

.dpad::after{

content:"";

position:absolute;

background:#666;

}

.dpad::before{

width:18px;

height:58px;

left:20px;

}

.dpad::after{

width:58px;

height:18px;

top:20px;

}

.buttons{

position:absolute;

right:38px;

top:42px;

display:grid;

grid-template-columns:repeat(2,42px);

gap:16px;

}

.buttons span{

width:40px;

height:40px;

border-radius:50%;

background:#8a8a8a;

display:flex;

align-items:center;

justify-content:center;

color:white;

font-size:13px;

box-shadow:inset 0 2px 3px rgba(255,255,255,.35);

}

.engrave{

text-align:center;

font-size:12px;

color:#666;

margin-bottom:10px;

letter-spacing:2px;

}

</style>
</head>

<body>

<div class="wrapper">

<div class="title">Lalaloopsy ♡</div>

<div class="subtitle">Angel Archive • Nintendo DS</div>

<div class="ds">

<div class="engrave">Nintendo DS</div>

<div id="game"></div>

<div class="bottom">

<div class="dpad"></div>

<div class="buttons">

<span>Y</span>
<span>X</span>
<span>B</span>
<span>A</span>

</div>

<div class="power">

<div class="light"></div>

POWER

</div>

</div>

</div>

</div>

<script>
    EJS_player = "#game";
    EJS_core = "nds";
    EJS_pathtodata = "/emulatorjs/data/";
    EJS_gameUrl = "./Lalaloopsy%20(USA)%20(En,Fr).nds";
</script>

<script src="/emulatorjs/data/loader.js"></script>

</body>
</html>
