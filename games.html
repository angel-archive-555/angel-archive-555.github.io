h1 {

p.intro {
  text-align: center;
  font-size: 20px;

  color: #B0B0B0;
}

/* Game grid */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 18px;
  max-width: 900px;
  margin: 0 auto;
}

/* Game cards */
.game-card {
  background-color: #F8D8E2;
  padding: 12px;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  text-align: center;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  color: #B0B0B0;
}

.game-card:hover {
  transform: scale(1.04);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
}

/* Game images */
.game-card img {
  width: 100%;
  height: 190px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 10px;
}

/* Play button */
.game-card a {
  display: inline-block;
  background-color: #FFECEC;
  color: #B0B0B0;
  padding: 7px 13px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  transition: all 0.2s ease;
}

.game-card a:hover {
  background-color: #FFB6C1;
  transform: scale(1.05);
  color: #B0B0B0;
}

footer {
  margin-top: 50px;
  text-align: center;
  font-size: 16px;
  color: #B0B0B0;
}

/* Smaller screens */
@media (max-width: 600px) {
  .game-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .game-card img {
    height: 160px;
  }
}
