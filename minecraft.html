<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Page</title>
    <style>
      /* Optional: Style the iframe and the page */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      iframe {
        border: none;
        width: 100%;
        height: 100vh;
        /* Adjust height to full viewport height */
      }
    </style>
  </head>
  <body>
    <iframe src="https://eaglercraftextras.github.io/clients/1.8/eaglercraftx.html" frameborder="0" width="100%" height="100%" scrolling="yes" frameborder="0" marginheight="0" marginwidth="0">
      <p>Your browser does not support iframes.</p>
    </iframe>
  </body>
</html>
